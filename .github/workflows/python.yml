name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[desktop]"

      - name: Compile Python
        run: python -m py_compile autologin.py seu_wlan/*.py

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          seu-wlan --version
          python -m seu_wlan --version

      - name: Check iOS Scriptable syntax
        run: node --input-type=module --check < platforms/ios/scriptable/seu-wlan-autologin.js

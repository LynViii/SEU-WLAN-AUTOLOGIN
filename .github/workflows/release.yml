name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source package
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements/build.txt
      - name: Build EXE
        run: pyinstaller --clean --noconfirm packaging/windows.spec
      - name: Smoke test
        shell: pwsh
        run: |
          & .\dist\SEU-WLAN-AUTOLOGIN.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\SEU-WLAN-AUTOLOGIN.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SEU-WLAN-AUTOLOGIN.exe" | Out-File .\dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/SEU-WLAN-AUTOLOGIN.exe
            dist/SHA256SUMS.txt

  publish:
    needs: [python-package, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Add mobile helper files
        run: |
          cp platforms/ios/scriptable/seu-wlan-autologin.js release-assets/SEU-WLAN-AUTOLOGIN-Scriptable.js
          cp platforms/android/install-termux.sh release-assets/SEU-WLAN-AUTOLOGIN-Termux-install.sh
          cp platforms/android/uninstall-termux.sh release-assets/SEU-WLAN-AUTOLOGIN-Termux-uninstall.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --title "SEU-WLAN-AUTOLOGIN ${{ github.ref_name }}" --generate-notes

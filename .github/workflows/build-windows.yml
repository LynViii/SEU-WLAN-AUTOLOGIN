name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "autologin.py"
      - "seu_wlan/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install ".[build]"

      - name: Build single-file EXE
        run: pyinstaller --clean --noconfirm packaging/windows.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          & .\dist\SEU-WLAN-AUTOLOGIN.exe --version
          & .\dist\SEU-WLAN-AUTOLOGIN.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\SEU-WLAN-AUTOLOGIN.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SEU-WLAN-AUTOLOGIN.exe" | Out-File .\dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: SEU-WLAN-AUTOLOGIN-windows-x64
          path: |
            dist/SEU-WLAN-AUTOLOGIN.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
